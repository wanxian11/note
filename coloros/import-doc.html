function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.hidden = false;
  clearTimeout(t._tm);
  t._tm = setTimeout(function () { t.hidden = true; }, 2200);
}

var preview = document.getElementById('docPreview');
preview.innerHTML = NF.sanitize(HTML);
/* 文档预览用阅读视图的排版规则（与 style.css 的 .read-body 同源） */

/* 站点根地址跟随当前访问域名：github.io 与自定义域名都自动适配，file:// 预览时回落到正式域名 */
function pageBase() {
  if (!/^https?:$/.test(location.protocol)) return 'https://zxkol77.com/note/coloros/';
  return location.origin + location.pathname.replace(/[^/]*$/, '');
}

function doShare() {
  NF.encode({ v: 1, title: TITLE, html: HTML, ts: Date.now() }).then(function (enc) {
    var link = pageBase() + '#' + enc;
    var done = function (short) {
      toast(short ? '短链接已复制，直接发就行 ✓' : '分享链接已复制（' + (link.length / 1024).toFixed(1) + ' KB）');
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = link;
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(false); } catch (e) { toast('复制失败，请手动复制'); }
      document.body.removeChild(ta);
    };
    if (link.length <= 500) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function(){done(false);}, fallback);
      } else fallback();
      return;
    }
    /* 长链自动转 TinyURL 短链，失败回退完整链接 */
    fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(link))
      .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
      .then(function (short) {
        short = (short || '').trim();
        if (!/^https:\/\/tinyurl\.com\/\w+$/.test(short)) short = link;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(short).then(function(){done(short!==link);}, fallback);
        } else fallback();
      })
      ['catch'](function () {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(function(){done(false);}, fallback);
        } else fallback();
      });
  });
}
document.getElementById('btnShare').onclick = doShare;
document.getElementById('btnShareTop').onclick = doShare;
