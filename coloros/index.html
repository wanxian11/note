<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<title>便签 · 复刻版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SVG 图标定义：统一 24 画布 / 1.7 描边 / 圆头端点 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20 20"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.2h9.2L17.5 7M10.2 10.8v5M13.8 10.8v5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="6.5" cy="12" r="2.4"/><circle cx="17" cy="6.2" r="2.4"/><circle cx="17" cy="17.8" r="2.4"/><path d="M8.7 10.9l6.1-3.5M8.7 13.1l6.1 3.5"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h13M12.5 5.5L19 12l-6.5 6.5"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4.5 10.5A8 8 0 1 1 12 20"/><path d="M4.5 5.5v5h5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.4 1.4"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.4-1.4"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 4.5h8.5L19 9v10.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1z"/><path d="M14.2 4.7v4.5h4.5M8.5 13h7M8.5 16.2h4.5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="1.6"/><path d="M8.2 10.5V8a3.8 3.8 0 0 1 7.6 0v2.5M12 14v2.6"/></symbol>
    <symbol id="i-bullet" viewBox="0 0 24 24"><circle cx="5.6" cy="7.5" r="1.15" fill="currentColor" stroke="none"/><circle cx="5.6" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="5.6" cy="16.5" r="1.15" fill="currentColor" stroke="none"/><path d="M9.5 7.5h10M9.5 12h10M9.5 16.5h10"/></symbol>
    <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.2"/><path d="M8.4 12.2l2.6 2.6 4.6-5"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5.2" width="16" height="13.6" rx="2.4"/><circle cx="9" cy="10" r="1.35"/><path d="M5.2 17.2l4.4-4 3.3 3 2.6-2.3 4.3 4"/></symbol>
    <symbol id="i-align-center" viewBox="0 0 24 24"><path d="M5 7h14M7.5 12h9M5 17h14"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8.5 6.5L4 11l4.5 4.5"/><path d="M4 11h9.5a5 5 0 0 1 0 10H10"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15.5 6.5L20 11l-4.5 4.5"/><path d="M20 11h-9.5a5 5 0 0 0 0 10H14"/></symbol>
  </defs>
</svg>

<!-- ============ 列表视图 ============ -->
<section id="listView">
  <header class="l-head">
    <h1 id="lTitle">便签</h1>
    <div class="l-tools">
      <button id="searchBtn" class="ib" title="搜索" aria-label="搜索">
        <svg class="ico"><use href="#i-search"/></svg>
      </button>
      <button id="emptyTrash" class="ib" title="清空回收站" aria-label="清空回收站">
        <svg class="ico"><use href="#i-trash"/></svg>
      </button>
    </div>
    <div class="search-wrap" id="searchWrap" hidden>
      <input id="searchInput" placeholder="搜索标题或正文" aria-label="搜索便签">
      <button id="searchClose" aria-label="关闭搜索"><svg class="ico" style="width:16px;height:16px"><use href="#i-close"/></svg></button>
    </div>
  </header>

  <nav class="fol-row" id="folders" aria-label="分类"></nav>
  <div class="l-count" id="listCount"></div>

  <main class="grid" id="grid"></main>

  <div class="empty" id="empty" hidden>
    <span class="empty-ico"><svg class="ico"><use href="#i-note"/></svg></span>
    <p>还没有便签</p>
  </div>

  <button class="fab" id="fab" aria-label="新建便签">
    <svg class="ico"><use href="#i-plus"/></svg>
  </button>
</section>

<!-- ============ 编辑视图 ============ -->
<section id="editView" hidden>
  <header class="e-head">
    <button class="ib" id="backBtn" title="返回" aria-label="返回">
      <svg class="ico"><use href="#i-back"/></svg>
    </button>
    <span class="e-meta" id="editMeta"></span>
    <div class="e-acts">
      <button class="ib" id="shareBtn" title="分享" aria-label="分享">
        <svg class="ico"><use href="#i-share"/></svg>
      </button>
      <button class="ib" id="restoreBtn" hidden title="恢复" aria-label="恢复便签">
        <svg class="ico"><use href="#i-restore"/></svg>
      </button>
      <button class="ib" id="delBtn" title="移入回收站" aria-label="移入回收站">
        <svg class="ico"><use href="#i-trash"/></svg>
      </button>
      <button class="ib" id="trashBtn" title="关闭" aria-label="关闭并返回列表">
        <svg class="ico"><use href="#i-next"/></svg>
      </button>
    </div>
  </header>

  <div class="paper" id="paperBox" data-note-color="paper">
    <input id="titleInput" placeholder="标题" aria-label="便签标题">
    <div id="editor" contenteditable="true" spellcheck="false" data-ph="开始输入…" aria-label="便签正文" role="textbox" aria-multiline="true"></div>
  </div>

  <footer class="e-tools">
    <div class="t-row" id="toolbar" role="toolbar" aria-label="格式工具">
      <button data-t="bold" title="加粗" aria-label="加粗" style="font-weight:680;font-size:15px">B</button>
      <button data-t="italic" title="斜体" aria-label="斜体" style="font-style:italic;font-size:15px;font-family:Georgia,serif">I</button>
      <button data-t="underline" title="下划线" aria-label="下划线" style="text-decoration:underline;text-underline-offset:2px;font-size:15px">U</button>
      <button data-t="strike" title="删除线" aria-label="删除线" style="text-decoration:line-through;font-size:15px">S</button>
      <span class="sep" aria-hidden="true"></span>
      <button data-t="h2" title="标题" aria-label="标题" style="font-weight:660;font-size:14px">H</button>
      <button data-t="quote" title="引用" aria-label="引用" style="font-size:17px;line-height:1">“</button>
      <button data-t="ul" title="无序列表" aria-label="无序列表">
        <svg class="ico"><use href="#i-bullet"/></svg>
      </button>
      <button data-t="ol" title="有序列表" aria-label="有序列表" style="font-size:13px;font-variant-numeric:tabular-nums">1.</button>
      <button data-t="todo" title="待办" aria-label="插入待办">
        <svg class="ico"><use href="#i-check-square"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button data-t="hr" title="分割线" aria-label="插入分割线">
        <svg class="ico"><use href="#i-minus"/></svg>
      </button>
      <button data-t="img" title="插入图片" aria-label="插入图片">
        <svg class="ico"><use href="#i-image"/></svg>
      </button>
      <button data-t="center" title="居中" aria-label="居中对齐">
        <svg class="ico"><use href="#i-align-center"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button data-t="undo" title="撤销" aria-label="撤销">
        <svg class="ico"><use href="#i-undo"/></svg>
      </button>
      <button data-t="redo" title="重做" aria-label="重做">
        <svg class="ico"><use href="#i-redo"/></svg>
      </button>
    </div>
    <div class="t-row colors" id="colorRow" role="group" aria-label="便签纸颜色"></div>
    <input type="file" id="imgFile" accept="image/*" hidden>
  </footer>
</section>

<!-- ============ 分享链接阅读视图 ============ -->
<section id="readView" hidden>
  <header class="e-head">
    <span class="e-meta" id="readMeta"></span>
    <div class="e-acts">
      <button class="ib" id="readCopyBtn" title="复制链接" aria-label="复制链接">
        <svg class="ico"><use href="#i-link"/></svg>
      </button>
      <button class="ib" id="readSaveBtn" title="存为我的便签" aria-label="存为我的便签">
        <svg class="ico"><use href="#i-plus"/></svg>
      </button>
    </div>
  </header>
  <div class="paper" style="margin-top:8px">
    <h2 id="readTitle" class="read-t"></h2>
    <div id="readPaper" class="read-body"></div>
  </div>
  <footer class="read-foot">
    <button class="rf-btn" id="readPwBtn" hidden>
      <svg class="ico" style="width:17px;height:17px;display:inline-block;vertical-align:-3px;margin-right:6px"><use href="#i-lock"/></svg>输入密码查看
    </button>
  </footer>
</section>

<!-- ============ 分享面板 ============ -->
<div class="sheet" id="shareSheet" hidden>
  <div class="sheet-mask" id="shareMask"></div>
  <div class="sheet-body">
    <div class="sh-title">分享笔记</div>
    <button class="sh-item" id="shLink">以链接形式分享</button>
    <button class="sh-item" id="shText">以文字形式分享</button>
    <button class="sh-item" id="shPic">以图片形式分享</button>
    <div class="sh-pw" id="shPwRow" hidden>
      <label class="sh-pw-label" for="shPwInput">查看密码</label>
      <input type="password" id="shPwInput" placeholder="留空 = 不加密" aria-label="查看密码，留空则不加密">
      <button id="shPwGo">生成</button>
    </div>
    <div class="sh-link" id="shLinkBox" hidden></div>
    <button class="sh-cancel" id="shCancel">取消</button>
  </div>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="codec.js"></script>
<script src="db.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
