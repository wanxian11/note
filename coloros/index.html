<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>便签 · 复刻版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ 列表视图 ============ -->
<section id="listView">
  <header class="l-head">
    <h1 id="lTitle">便签</h1>
    <div class="l-tools">
      <button id="searchBtn" class="ib" title="搜索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="emptyTrash" class="ib" title="清空回收站">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="search-wrap" id="searchWrap" hidden>
      <input id="searchInput" placeholder="搜索便签">
      <button id="searchClose">✕</button>
    </div>
  </header>
  <nav class="fol-row" id="folders"></nav>
  <div class="l-count" id="listCount"></div>
  <main class="grid" id="grid"></main>
  <div class="empty" id="empty" hidden><div class="empty-ico">🗒️</div><p>还没有便签，点右下角新建</p></div>
  <button class="fab" id="fab">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
</section>

<!-- ============ 编辑视图 ============ -->
<section id="editView" hidden>
  <header class="e-head">
    <button class="ib" id="backBtn" title="返回">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="e-meta" id="editMeta"></span>
    <div class="e-acts">
      <button class="ib" id="shareBtn" title="分享">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="6" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17" cy="18" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.4 10.8l6.2-3.4M8.4 13.2l6.2 3.4" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button class="ib" id="restoreBtn" hidden title="恢复">↩︎</button>
      <button class="ib" id="delBtn" title="删除">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="ib" id="trashBtn" title="移入回收站">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>
  <div class="paper" id="paperBox" data-note-color="paper">
    <input id="titleInput" placeholder="标题">
    <div id="editor" contenteditable="true" spellcheck="false" data-ph="开始输入…"></div>
  </div>
  <footer class="e-tools">
    <div class="t-row" id="toolbar">
      <button data-t="bold"><b>B</b></button>
      <button data-t="italic"><i>I</i></button>
      <button data-t="underline"><u>U</u></button>
      <button data-t="strike"><s>S</s></button>
      <span class="sep"></span>
      <button data-t="h2">H</button>
      <button data-t="quote">❝</button>
      <button data-t="ul">≡</button>
      <button data-t="ol">1.</button>
      <button data-t="todo">☑</button>
      <span class="sep"></span>
      <button data-t="hr">—</button>
      <button data-t="img">🖼</button>
      <button data-t="center">⇹</button>
      <span class="sep"></span>
      <button data-t="undo">↶</button>
      <button data-t="redo">↷</button>
    </div>
    <div class="t-row colors" id="colorRow"></div>
    <input type="file" id="imgFile" accept="image/*" hidden>
  </footer>
</section>

<!-- ============ 分享链接阅读视图 ============ -->
<section id="readView" hidden>
  <header class="e-head">
    <span class="e-meta" id="readMeta"></span>
    <div class="e-acts">
      <button class="ib" id="readCopyBtn" title="复制链接">🔗</button>
      <button class="ib" id="readSaveBtn" title="存为我的便签">＋</button>
    </div>
  </header>
  <div class="paper" style="margin-top:6px">
    <h2 id="readTitle" class="read-t"></h2>
    <div id="readPaper" class="read-body"></div>
  </div>
  <footer class="read-foot">
    <button class="rf-btn" id="readPwBtn" hidden>🔒 输入密码查看</button>
  </footer>
</section>

<!-- ============ 分享面板（仿 ColorOS「分享笔记」） ============ -->
<div class="sheet" id="shareSheet" hidden>
  <div class="sheet-mask" id="shareMask"></div>
  <div class="sheet-body">
    <div class="sh-title">分享笔记</div>
    <button class="sh-item" id="shLink">以链接形式分享</button>
    <button class="sh-item" id="shText">以文字形式分享</button>
    <button class="sh-item" id="shPic">以图片形式分享</button>
    <div class="sh-pw" id="shPwRow" hidden>
      <input type="password" id="shPwInput" placeholder="设置查看密码（至少 4 位，可留空=不加密）">
      <button id="shPwGo">生成</button>
    </div>
    <div class="sh-link" id="shLinkBox" hidden></div>
    <button class="sh-cancel" id="shCancel">取消</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="codec.js"></script>

<script src="db.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
