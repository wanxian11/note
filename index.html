<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拾光笔记</title>
<meta property="og:title" content="拾光笔记 · 一篇随手记">
<meta property="og:description" content="点击阅读全文">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='18' y='10' width='64' height='80' rx='14' fill='%23f5f2ea' stroke='%23c9b98a' stroke-width='4'/%3E%3Cline x1='32' y1='30' x2='68' y2='30' stroke='%23b7a97e' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='32' y1='46' x2='68' y2='46' stroke='%23d5c9a3' stroke-width='5' stroke-linecap='round'/%3E%3Cline x1='32' y1='62' x2='56' y2='62' stroke='%23d5c9a3' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== 顶部栏 ========== -->
<header class="topbar">
  <button class="tb-btn" id="btnBack" title="返回">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="tb-title" id="docTitleLabel">拾光笔记</div>
  <div class="tb-right">
    <span class="save-dot" id="saveDot" title="已自动保存到本机"></span>
    <button class="tb-btn" id="btnMore" title="更多">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
    <button class="tb-btn share" id="btnShare" title="生成分享链接">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M12 3l-4 4M12 3l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 13v5a2 2 0 002 2h10a2 2 0 002-2v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<!-- ========== 纸张编辑区 ========== -->
<main class="paper-wrap" id="paperWrap">
  <div class="paper" id="paper">
    <input class="paper-h1" id="titleInput" placeholder="标题" spellcheck="false">
    <div class="paper-meta">
      <button class="chip" id="chipColor" title="正文颜色">
        <span class="chip-dot" id="chipColorDot"></span><span id="chipColorName">墨黑</span>
      </button>
      <button class="chip" id="chipFont" title="字体">
        <span id="chipFontName">默认</span>
      </button>
      <button class="chip" id="chipSize" title="字号">
        <span id="chipSizeName">标准</span>
      </button>
      <span class="meta-date" id="metaDate"></span>
    </div>
    <div id="editor" contenteditable="true" spellcheck="false" data-ph="开始写点什么…"></div>
    <div class="word-count" id="wordCount">0 字</div>
  </div>
</main>

<!-- ========== 底部工具栏 ========== -->
<nav class="toolbar" id="toolbar">
  <button data-cmd="undo" title="撤销"><svg viewBox="0 0 24 24"><path d="M8 5L3 10l5 5M3 10h11a6 6 0 010 12h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button data-cmd="bold" title="加粗"><b>B</b></button>
  <button data-cmd="italic" title="斜体"><i>I</i></button>
  <button data-cmd="underline" title="下划线"><u>U</u></button>
  <button data-cmd="strikeThrough" title="删除线"><s>S</s></button>
  <span class="tb-sep"></span>
  <button data-pop="blocks" title="段落样式"><svg viewBox="0 0 24 24"><text x="3" y="10" font-size="9" font-weight="700" fill="currentColor">H1</text><path d="M3 14h18M3 18h12M3 22h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <button data-pop="list" title="列表"><svg viewBox="0 0 24 24"><circle cx="4.5" cy="6" r="1.6"/><circle cx="4.5" cy="12" r="1.6"/><circle cx="4.5" cy="18" r="1.6"/><path d="M9 6h12M9 12h12M9 18h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button data-cmd="insertHorizontalRule" title="分割线"><svg viewBox="0 0 24 24"><path d="M3 12h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M7 6h10M7 18h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".4"/></svg></button>
  <button data-pop="quote" title="引用 / 高亮"><svg viewBox="0 0 24 24"><path d="M4 14c0-5 3-8 7-9l.6 1.6C8.7 7.6 7.3 9.3 7 11.2c.3-.1.7-.2 1-.2 2 0 3.4 1.4 3.4 3.3S10 17.6 8 17.6 4 16 4 14zm9 0c0-5 3-8 7-9l.6 1.6c-2.9 1-4.3 2.7-4.6 4.6.3-.1.7-.2 1-.2 2 0 3.4 1.4 3.4 3.3s-1.4 3.3-3.4 3.3S13 16 13 14z" fill="currentColor"/></svg></button>
  <button id="btnImg" title="插入图片"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8.5" cy="10" r="1.7" fill="currentColor"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
  <input type="file" id="imgFile" accept="image/*" hidden>
</nav>

<!-- ========== 弹出面板（颜色/字体/字号/段落） ========== -->
<div class="pop" id="pop" hidden></div>
<div class="pop-anchor" id="popAnchor" hidden></div>

<!-- ========== 更多菜单 ========== -->
<div class="sheet" id="moreSheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <button class="sheet-item" id="miTheme"><span>切换纸张主题</span><em id="miThemeName">宣纸</em></button>
    <button class="sheet-item" id="miExport"><span>导出为 HTML 文件</span></button>
    <button class="sheet-item" id="miCopy"><span>复制全文为纯文本</span></button>
    <button class="sheet-item" id="miClear"><span class="danger">清空当前笔记</span></button>
    <button class="sheet-item" data-close><span>关闭</span></button>
  </div>
</div>

<!-- ========== 分享面板 ========== -->
<div class="sheet" id="shareSheet" hidden>
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="share-head">
      <div class="share-title">分享这篇笔记</div>
      <div class="share-sub" id="linkSize">链接生成中…</div>
    </div>
    <div class="link-box" id="linkBox"></div>
    <div class="share-actions">
      <button class="sa-main" id="btnCopyLink">复制链接</button>
      <button class="sa-alt" id="btnPw">🔒 加密码分享</button>
    </div>
    <div class="pw-row" id="pwRow" hidden>
      <input type="password" id="pwInput" placeholder="设置查看密码（至少 4 位）">
      <button id="btnPwGo">生成</button>
    </div>
    <p class="share-tip">正文编码在链接的 <b>#</b> 片段里，不会经过任何服务器；复制到微信 / 朋友圈打开即读，无跳转无域名拦截。</p>
    <button class="sheet-item" data-close><span>关闭</span></button>
  </div>
</div>

<!-- ========== 阅读模式底栏 ========== -->
<div class="read-bar" id="readBar" hidden>
  <div class="rb-info"><span id="rbTitle">来自分享</span><em id="rbDate"></em></div>
  <button class="rb-btn" id="rbCopy">🔗 复制链接</button>
  <button class="rb-btn primary" id="rbEdit">✎ 继续编辑</button>
</div>

<!-- ========== 密码解锁页 ========== -->
<div class="unlock" id="unlock" hidden>
  <div class="unlock-card">
    <div class="unlock-ico">🔒</div>
    <div class="unlock-t">这篇笔记已加密</div>
    <div class="unlock-s">输入作者设置的查看密码</div>
    <input type="password" id="unlockPw" placeholder="查看密码">
    <button id="btnUnlock">打开笔记</button>
    <div class="unlock-err" id="unlockErr"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="codec.js"></script>
<script src="app.js"></script>
</body>
</html>
